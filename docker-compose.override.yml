services:
  apigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "6060:8080"
      - "6061:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - notification-service

  user-service:
    environment:
      - ConnectionStrings__DefaultConnection=Host=user-service-db;Port=5432;Database=user-service-db;Username=postgres;Password=mysecretpassword
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - Keycloak__Authority=http://keycloak:8080/realms/ecommerce
      - Keycloak__Audience=ecommerce-frontend
      - Keycloak__DevMode=true
    ports:
      - "6000:8080"
      - "6001:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      - user-service-db

  user-service-db:
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=user-service-db
    ports:
      - "5432:5432"
    volumes:
      - user_service_postgres_data:/var/lib/postgresql

  product-service:
    environment:
      - ConnectionStrings__DefaultConnection=Host=product-service-db;Port=5432;Database=product-service-db;Username=postgres;Password=mysecretpassword
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - Keycloak__Authority=http://keycloak:8080/realms/ecommerce
      - Keycloak__Audience=ecommerce-frontend
      - Keycloak__DevMode=true
    ports:
      - "6010:8080"
      - "6011:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      - product-service-db
      - keycloak

  product-service-db:
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=product-service-db
    ports:
      - "5433:5432"
    volumes:
      - product_service_postgres_data:/var/lib/postgresql

  cart-service:
    environment:
      - ConnectionStrings__Database=Host=cart-service-db;Port=5432;Database=cart-service-db;Username=postgres;Password=mysecretpassword
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - Keycloak__Authority=http://keycloak:8080/realms/ecommerce
      - Keycloak__Audience=ecommerce-frontend
      - Keycloak__DevMode=true
      - ProductServiceUrl=https://product-service:8081
      - PaymentServiceUrl=https://payment-service:8081
      - ConnectionStrings__Redis=distributed-cache:6379
      - RabbitMQ__Host=amqp://ecommerce-mq:5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    ports:
      - "6020:8080"
      - "6021:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      - cart-service-db
      - distributed-cache
      - keycloak

  cart-service-db:
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=cart-service-db
    ports:
      - "5434:5432"
    volumes:
      - cart_service_postgres_data:/var/lib/postgresql

  order-service:
    environment:
      - ConnectionStrings__Database=Host=order-service-db;Port=5432;Database=order-service-db;Username=postgres;Password=mysecretpassword
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - Keycloak__Authority=http://keycloak:8080/realms/ecommerce
      - Keycloak__Audience=ecommerce-frontend
      - Keycloak__DevMode=true
      - RabbitMQ__Host=amqp://ecommerce-mq:5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - MT_LICENSE=your-actual-license-key
    ports:
      - "6040:8080"
      - "6041:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      - order-service-db
      - keycloak

  order-service-db:
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=order-service-db
    ports:
      - "5435:5432"
    volumes:
      - order_service_postgres_data:/var/lib/postgresql

  distributed-cache:
    restart: always
    ports:
      - "6379:6379"

  message-broker:
    hostname: ecommerce-mq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"

  payment-service:
    environment:
      - Stripe__PublishableKey=your_stripe_public_key
      - Stripe__SecretKey=your_stripe_secret_key
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "6030:8080"
      - "6031:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro

  notification-service:
    environment:
      - ConnectionStrings__Database=Host=notification-service-db;Port=5432;Database=notification-service-db;Username=postgres;Password=mysecretpassword
      - ConnectionStrings__Redis=distributed-cache:6379
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - Keycloak__Authority=http://keycloak:8080/realms/ecommerce
      - Keycloak__Audience=ecommerce-frontend
      - Keycloak__DevMode=true
      - RabbitMQ__Host=amqp://ecommerce-mq:5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    ports:
      - "6050:8080"
      - "6051:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      - notification-service-db
      - distributed-cache
      - keycloak

  notification-service-db:
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=notification-service-db
    ports:
      - "5436:5432"
    volumes:
      - notification_service_postgres_data:/var/lib/postgresql
